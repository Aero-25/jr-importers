<html lang="en-NA" data-theme="light" data-field="light">
  <head>
    <meta charset="utf-8" />

    <title>JR Importers — Cellphones in Namibia</title>

    />

    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JR Importers" />
    <meta property="og:title" content="JR Importers — Cellphones in Namibia" />
    <meta
      property="og:description"
      content="Imported smartphones, laptops, tablets, audio and accessories at import prices. Nationwide delivery from Walvis Bay."
    />
    <meta property="og:url" content="https://jrimporters.com/" />
    <meta property="og:image" content="https://jrimporters.com/logo.png" />
    <meta property="og:locale" content="en_NA" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="theme-color" content="#153f35" />
    <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/logo-mark.png" as="image" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Opens the TLS connection to Supabase while the bundle is still parsing. -->
    <link rel="preconnect" href="https://snkvszndxwpozrefnpnv.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://snkvszndxwpozrefnpnv.supabase.co" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "JR Importers",
        "description": "Imported consumer electronics retailer in Namibia.",
        "url": "https://jrimporters.com/",
        "image": "https://jrimporters.com/logo.png",
        "priceRange": "N$$",
        "currenciesAccepted": "NAD",
        "paymentAccepted": "Cash, Card, EFT, Layby",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Walvis Bay",
          "addressCountry": "NA"
        },
        "areaServed": { "@type": "Country", "name": "Namibia" }
      }
    </script>

    <style>
      /* The JR loader: shown from the first byte until the page is ready, and
         again (inline) while a page's code loads. Kept here so it paints before
         any bundle arrives. */
      .jr-loader { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
      .jr-loader--boot { position: fixed; inset: 0; z-index: 9999; background: #f7f9f7; transition: opacity .45s ease, visibility .45s; }
      .jr-loader--boot.is-done { opacity: 0; visibility: hidden; pointer-events: none; }
      .jr-loader--inline { min-height: 50vh; }
      .jr-loader__mark { position: relative; }
      .jr-loader__mark::after { content: ''; position: absolute; left: -30%; right: -30%; bottom: -8px; height: 10px; border-radius: 50%;
        background: radial-gradient(ellipse, rgb(187 219 69 / .55), transparent 70%); animation: jr-shadow 2.4s ease-in-out 1.3s infinite; }
      .jr-loader__mark img { display: block; width: 44px; height: 80px; animation: jr-power 1.3s steps(1, end) both, jr-float 2.4s ease-in-out 1.3s infinite; }
      .jr-loader__word { font-family: 'Archivo', system-ui, sans-serif; font-weight: 800; font-size: 26px; line-height: .9; letter-spacing: -.05em; color: #153f35; text-align: center; }
      .jr-loader__word span { display: block; margin-top: 5px; font-family: 'Manrope', system-ui, sans-serif; font-size: 8px; font-weight: 700; letter-spacing: .34em; color: #5f7467; }
      .jr-loader__bar { width: 120px; height: 3px; border-radius: 3px; background: rgb(21 63 53 / .12); overflow: hidden; }
      .jr-loader__bar i { display: block; width: 40%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #bbdb45, #153f35); animation: jr-sweep 1.1s cubic-bezier(.6, 0, .4, 1) infinite; }
      @keyframes jr-power {
        0% { filter: brightness(0); } 16% { filter: brightness(1) drop-shadow(0 0 10px rgb(187 219 69 / .9)); }
        24% { filter: brightness(0); } 38% { filter: brightness(1) drop-shadow(0 0 12px rgb(187 219 69 / .9)); }
        44% { filter: brightness(0); } 58%, 100% { filter: brightness(1) drop-shadow(0 0 8px rgb(187 219 69 / .6)); }
      }
      @keyframes jr-float { 50% { transform: translateY(-5px); } }
      @keyframes jr-shadow { 50% { opacity: .45; transform: scaleX(.8); } }
      @keyframes jr-sweep { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
    </style>
    <!-- Legacy runtime config. Kept so a deploy can retarget Supabase without a rebuild. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <a
      href="#main"
      class="sr-only-focusable absolute left-4 top-4 z-[100] rounded-lg bg-brand-500 px-4 py-2 text-white"
    >
      Skip to content
    </a>
    <div id="jr-boot" class="jr-loader jr-loader--boot" role="status" aria-label="Loading JR Importers">
      <div class="jr-loader__mark"><img src="/logo-mark.png" alt="" width="44" height="80" /></div>
      <div class="jr-loader__word">JR<span>IMPORTERS</span></div>
      <div class="jr-loader__bar"><i></i></div>
    </div>
    <script>
      // Never strand a visitor behind the loader if the app fails to start.
      setTimeout(function () { var b = document.getElementById('jr-boot'); if (b) b.classList.add('is-done'); }, 12000);
    </script>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui; color: #0d263f; background: #ffffff">
        <h1>JR Importers</h1>
        <p>
          This shop needs JavaScript enabled. Please turn it on, or reach us on WhatsApp to order
          directly.
        </p>
      </div>
    </noscript>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
