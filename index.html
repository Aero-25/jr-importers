<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR Importers</title>
    <meta name="description" content="JR Importers brings live phone and electronics stock, secure checkout, and nationwide delivery into a faster installable shopping experience.">
    <meta name="application-name" content="JR Importers">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta name="theme-color" content="#84cc16">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta property="og:title" content="JR Importers">
    <meta property="og:description" content="Live stock, faster checkout, and a more installable shopping experience for JR Importers customers.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/icon.svg">
    <meta name="twitter:card" content="summary_large_image">
    
    <script src="/config.js"></script>
    <script defer src="/app-shell.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Space+Grotesk:wght@300;500;700&display=swap');
        
        :root { 
            --brand: #84cc16; 
            --dark: #020617;
            --lime-glow: rgba(132, 204, 22, 0.4);
        }
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        h1, h2, h3, .brand-font { font-family: 'Space Grotesk', sans-serif; }
        body { 
            background: linear-gradient(135deg, 
                #020617 0%, 
                #0f172a 25%,
                #1e1b4b 50%,
                #0f172a 75%,
                #020617 100%
            );
            background-size: 400% 400%;
            animation: galaxy-shift 20s ease infinite;
            color: #e2e8f0; 
            overflow-x: hidden; 
            position: relative;
        }
        
        /* Nebula clouds */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(132, 204, 22, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(59, 130, 246, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(168, 85, 247, 0.05) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        
        @keyframes galaxy-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }




        /* CONTENT WRAPPER */
        .content-wrapper {
            position: relative;
            z-index: 1;
        }

        /* PREMIUM GLASSMORPHISM */
        .glass-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(148, 163, 184, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(30px) saturate(200%);
            border: 1px solid rgba(148, 163, 184, 0.15);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        .glass-input {
            background: rgba(2, 6, 23, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: white;
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            outline: none;
            border-color: var(--brand);
            box-shadow: 0 0 0 3px var(--lime-glow);
            background: rgba(2, 6, 23, 0.8);
        }

        /* PREMIUM BUTTONS */
        .btn-primary {
            background: linear-gradient(135deg, #84cc16 0%, #22c55e 100%);
            color: #020617;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: none;
            box-shadow: 0 4px 20px rgba(132, 204, 22, 0.3), 0 0 40px rgba(132, 204, 22, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(132, 204, 22, 0.5), 0 0 60px rgba(132, 204, 22, 0.2);
        }
        .btn-primary:active { transform: translateY(0); }
        
        .glow-button {
            animation: glow-pulse 2s ease-in-out infinite;
        }
        @keyframes glow-pulse {
            0%, 100% { box-shadow: 0 4px 20px rgba(132, 204, 22, 0.3); }
            50% { box-shadow: 0 4px 30px rgba(132, 204, 22, 0.6), 0 0 50px rgba(132, 204, 22, 0.3); }
        }

        /* FIXED TOP HEADER - 25% TRANSPARENT (MORE SEE-THROUGH) */
        .header-island {
            background: linear-gradient(135deg, 
                rgba(2, 6, 23, 0.25) 0%, 
                rgba(15, 23, 42, 0.25) 50%, 
                rgba(2, 6, 23, 0.25) 100%
            );
            backdrop-filter: blur(120px) saturate(300%) brightness(1.1);
            -webkit-backdrop-filter: blur(120px) saturate(300%) brightness(1.1);
            border-bottom: 1px solid rgba(132, 204, 22, 0.3);
            box-shadow: 
                0 4px 30px rgba(0, 0, 0, 0.8),
                0 0 40px rgba(132, 204, 22, 0.1);
            position: relative;
            overflow: visible !important;
            z-index: 9999 !important;
        }
        
        /* Header content should be fully opaque */
        .header-island > * {
            opacity: 1 !important;
        }
        
        .header-island button,
        .header-island input,
        .header-island a,
        .header-island div,
        .header-island img,
        .header-island span {
            opacity: 1 !important;
        }
        
        /* Search bar in header should be fully opaque */
        .header-island .glass-input {
            background: rgba(2, 6, 23, 1) !important;
            opacity: 1 !important;
        }
        
        .header-island .glass-input:focus {
            background: rgba(15, 23, 42, 1) !important;
        }
        
        .header-island::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 150%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(132, 204, 22, 0.05), 
                transparent
            );
            animation: shimmer 6s infinite ease-in-out;
            pointer-events: none;
        }
        
        .header-island::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent,
                rgba(132, 204, 22, 0.5) 50%,
                transparent
            );
        }
        
        @keyframes shimmer {
            0% { left: -150%; }
            100% { left: 150%; }
        }
        
        /* Hide number input spinners for quantity controls */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        /* ========================================
           🎨 PRODUCT HOVER EFFECTS (3D Tilt & Glow)
           ======================================== */
        .product-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            position: relative;
        }
        
        .product-card:hover {
            transform: translateY(-12px) scale(1.03);
            box-shadow: 
                0 20px 60px rgba(132, 204, 22, 0.4),
                0 0 40px rgba(132, 204, 22, 0.2);
            border-color: rgba(132, 204, 22, 0.6);
        }
        
        .product-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(135deg, 
                rgba(132, 204, 22, 0.3), 
                rgba(132, 204, 22, 0) 50%, 
                rgba(132, 204, 22, 0.3)
            );
            border-radius: inherit;
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
            z-index: -1;
        }
        
        .product-card:hover::before {
            opacity: 1;
            animation: rotate-glow 4s linear infinite;
        }
        
        @keyframes rotate-glow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ========================================
           ⏳ LOADING SKELETONS
           ======================================== */
        .skeleton {
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0.03) 25%,
                rgba(255, 255, 255, 0.08) 50%,
                rgba(255, 255, 255, 0.03) 75%
            );
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s ease-in-out infinite;
            border-radius: 0.5rem;
        }
        
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        .skeleton-text {
            height: 1rem;
            margin-bottom: 0.5rem;
        }
        
        .skeleton-title {
            height: 1.5rem;
            width: 60%;
            margin-bottom: 0.75rem;
        }
        
        .skeleton-image {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 1rem;
        }

        /* ========================================
           🎆 CONFETTI ANIMATION
           ======================================== */
        .confetti-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            animation: confetti-fall 3s ease-out forwards;
        }
        
        @keyframes confetti-fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* ========================================
           🎯 CART COUNTER BOUNCE
           ======================================== */
        @keyframes cart-bounce {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.3); }
            50% { transform: scale(0.9); }
            75% { transform: scale(1.15); }
        }
        
        .cart-badge-bounce {
            animation: cart-bounce 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ========================================
           💫 RIPPLE EFFECT
           ======================================== */
        .ripple-container {
            position: relative;
            overflow: hidden;
        }
        
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(132, 204, 22, 0.5);
            transform: scale(0);
            animation: ripple-animation 0.6s ease-out;
            pointer-events: none;
        }
        
        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* ========================================
           🌊 PAGE TRANSITION EFFECTS
           ======================================== */
        .page-transition-enter {
            animation: page-enter 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @keyframes page-enter {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        .page-transition-exit {
            animation: page-exit 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @keyframes page-exit {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-20px) scale(0.98);
            }
        }

        /* ========================================
           ✨ SUCCESS CHECKMARK ANIMATION
           ======================================== */
        @keyframes checkmark-pop {
            0% {
                transform: scale(0) rotate(-45deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.2) rotate(-45deg);
            }
            100% {
                transform: scale(1) rotate(-45deg);
                opacity: 1;
            }
        }
        
        .checkmark-animate {
            animation: checkmark-pop 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ========================================
           🎪 BUTTON PRESS EFFECT
           ======================================== */
        .btn-press:active {
            transform: scale(0.95);
            transition: transform 0.1s ease;
        }

        /* DRAMATIC HERO ANIMATIONS */
        @keyframes slideUp {
            from { 
                opacity: 0; 
                transform: translateY(60px) scale(0.95); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }
        
        @keyframes bounce-x {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(8px); }
        }
        .animate-bounce-x {
            animation: bounce-x 1.5s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { 
                transform: translateY(0) translateX(0) scale(1); 
                opacity: 0.3;
            }
            25% { 
                transform: translateY(-40px) translateX(20px) scale(1.2); 
                opacity: 0.7;
            }
            50% { 
                transform: translateY(-80px) translateX(-10px) scale(0.8); 
                opacity: 0.4;
            }
            75% { 
                transform: translateY(-40px) translateX(-30px) scale(1.1); 
                opacity: 0.6;
            }
        }
        .animate-float {
            animation: float 8s ease-in-out infinite;
        }
        
        @keyframes pulse-slow {
            0%, 100% { 
                transform: scale(1); 
                box-shadow: 0 0 40px rgba(132,204,22,0.6);
            }
            50% { 
                transform: scale(1.05); 
                box-shadow: 0 0 60px rgba(132,204,22,0.9);
            }
        }
        .animate-pulse-slow {
            animation: pulse-slow 3s ease-in-out infinite;
        }
        
        .animate-slide-up {
            animation: slideUp 1s ease-out;
        }

        /* PREMIUM ANIMATIONS */
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .slide-in-right { animation: slideInRight 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        /* HERO CAROUSEL ANIMATIONS */
        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(30deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(30deg); }
        }
        .animate-shine { animation: shine 8s ease-in-out infinite; }

        /* SCROLLBAR STYLING */
        .scroller::-webkit-scrollbar { width: 6px; height: 6px; }
        .scroller::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 10px; }
        .scroller::-webkit-scrollbar-thumb { 
            background: rgba(132, 204, 22, 0.5); 
            border-radius: 10px; 
            transition: background 0.3s;
        }
        .scroller::-webkit-scrollbar-thumb:hover { background: rgba(132, 204, 22, 0.8); }

        /* BADGE STYLES */
        .badge {
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 9999px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .badge-gold {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: #78350f;
            box-shadow: 0 2px 10px rgba(251, 191, 36, 0.4);
        }
        .badge-silver {
            background: linear-gradient(135deg, #e5e7eb 0%, #9ca3af 100%);
            color: #1f2937;
            box-shadow: 0 2px 10px rgba(156, 163, 175, 0.4);
        }
        .badge-bronze {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: #7c2d12;
            box-shadow: 0 2px 10px rgba(249, 115, 22, 0.4);
        }

        /* MODAL OVERLAY */
        .modal-overlay {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
        }

        /* LIVE INDICATOR */
        .live-indicator {
            width: 10px;
            height: 10px;
            background: linear-gradient(135deg, #22c55e, #84cc16);
            border-radius: 50%;
            position: relative;
            animation: pulse 2s ease-in-out infinite;
        }
        .live-indicator::before {
            content: '';
            position: absolute;
            inset: -3px;
            background: inherit;
            border-radius: 50%;
            opacity: 0.3;
            filter: blur(4px);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { 
                opacity: 1; 
                transform: scale(1); 
                box-shadow: 
                    0 0 15px rgba(132, 204, 22, 0.8),
                    0 0 30px rgba(34, 197, 94, 0.5); 
            }
            50% { 
                opacity: 0.6; 
                transform: scale(1.1); 
                box-shadow: 
                    0 0 25px rgba(132, 204, 22, 1),
                    0 0 50px rgba(34, 197, 94, 0.7); 
            }
        }

        /* COMPARISON TABLE */
        .comparison-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        /* LOYALTY TIER STYLES */
        .tier-card {
            position: relative;
            overflow: hidden;
        }
        .tier-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transform: rotate(45deg);
            animation: shimmer 3s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        /* CHAT WIDGET */
        .chat-widget {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
        }
        .chat-bubble {
            background: linear-gradient(135deg, #84cc16 0%, #22c55e 100%);
            box-shadow: 0 8px 30px rgba(132, 204, 22, 0.4);
            animation: bounce 2s ease-in-out infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* NOTIFICATION TOAST */
        .toast {
            position: fixed;
            top: 100px;
            right: 20px;
            z-index: 999999;
            animation: slideInRight 0.3s ease-out;
        }

        /* VOICE SEARCH ANIMATION */
        .voice-pulse {
            animation: voicePulse 1.5s ease-in-out infinite;
        }
        @keyframes voicePulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        /* PRODUCT HOVER EFFECTS */
        .product-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(132, 204, 22, 0.2), 0 0 80px rgba(132, 204, 22, 0.1);
        }

        /* SEARCH SUGGESTIONS */
        .search-suggestions {
            position: absolute !important;
            top: 100% !important;
            left: 0;
            right: 0;
            margin-top: 8px;
            max-height: 400px;
            overflow-y: auto;
            z-index: 99999 !important;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(132, 204, 22, 0.2);
            border: 1px solid rgba(132, 204, 22, 0.3);
            animation: slideDown 0.2s ease-out;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* BUNDLE OFFER BADGE */
        .bundle-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.5);
            animation: wiggle 2s ease-in-out infinite;
        }
        @keyframes wiggle {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        /* PROGRESS BAR */
        .progress-bar {
            height: 4px;
            background: rgba(132, 204, 22, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #84cc16 0%, #22c55e 100%);
            transition: width 0.3s ease;
        }

        .page-shell {
            width: min(100%, 1280px);
            margin: 0 auto;
        }

        .h-scroll {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .h-scroll::-webkit-scrollbar {
            display: none;
        }

        .nav-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.75rem 1rem;
            border-radius: 999px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            background: rgba(15, 23, 42, 0.55);
            color: #cbd5e1;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.01em;
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .nav-chip span {
            color: #84cc16;
            font-size: 0.72rem;
            font-weight: 800;
        }

        .nav-chip:hover,
        .nav-chip.active {
            color: white;
            border-color: rgba(132, 204, 22, 0.45);
            background: rgba(132, 204, 22, 0.14);
            transform: translateY(-1px);
            box-shadow: 0 12px 30px rgba(2, 6, 23, 0.28);
        }

        .hero-command-card {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(148, 163, 184, 0.14);
        }

        .hero-command-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at top right, rgba(132, 204, 22, 0.12), transparent 36%),
                radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.08), transparent 38%);
            pointer-events: none;
        }

                const x = event.clientX - rect.left - size / 2;

                ripple.className = 'ripple';

                                                <div className="p-3 md:p-4 bg-slate-800/50 text-slate-400 text-xs md:text-sm font-medium flex items-center gap-2">
                                                    <i className="fab fa-android text-green-400"></i> OS
                                                </div>
                                                {compareList.map(p => (
                                                    <div key={p.id} className="p-3 md:p-4 text-center text-white text-xs md:text-sm border-l border-slate-800">
                                                        {p.spec_os || '-'}
                                                    </div>
                                                ))}
                                            </div>
                                            
                                            {/* Weight */}
                                            <div className="grid" style={{gridTemplateColumns: `140px repeat(${compareList.length}, 1fr)`}}>
                                                <div className="p-3 md:p-4 bg-slate-800/50 text-slate-400 text-xs md:text-sm font-medium flex items-center gap-2">
                                                    <i className="fas fa-weight-hanging text-slate-400"></i> Weight
                                                </div>
                                                {compareList.map(p => (
                                                    <div key={p.id} className="p-3 md:p-4 text-center text-white text-xs md:text-sm border-l border-slate-800">
                                                        {p.spec_weight || '-'}
                                                    </div>
                                                ))}
                                            </div>
                                            
                                            {/* Features */}
                                            <div className="grid" style={{gridTemplateColumns: `140px repeat(${compareList.length}, 1fr)`}}>
                                                <div className="p-3 md:p-4 bg-slate-800/50 text-slate-400 text-xs md:text-sm font-medium flex items-center gap-2">
                                                    <i className="fas fa-star text-yellow-400"></i> Features
                                                </div>
                                                {compareList.map(p => (
                                                    <div key={p.id} className="p-3 md:p-4 text-center text-white text-xs border-l border-slate-800">
                                                        {p.spec_extras || '-'}
                                                    </div>
                                                ))}
                                            </div>
                                            
                                            {/* Stock */}
                                            <div className="grid" style={{gridTemplateColumns: `140px repeat(${compareList.length}, 1fr)`}}>
                                                <div className="p-3 md:p-4 bg-slate-800/50 text-slate-400 text-xs md:text-sm font-medium flex items-center gap-2">
                                                    <i className="fas fa-box text-blue-400"></i> Stock
                                                </div>
                                                {compareList.map(p => (
                                                    <div key={p.id} className="p-3 md:p-4 text-center border-l border-slate-800">
                                                        <span className={`text-xs md:text-sm font-bold ${p.stock > 0 ? 'text-green-400' : 'text-red-400'}`}>
                                                            {p.stock > 0 ? `${p.stock} available` : 'Out of stock'}
                                                        </span>
                                                    </div>
                                                ))}
                                            </div>
                                            
                                            {/* Add to Cart */}
                                            <div className="grid" style={{gridTemplateColumns: `140px repeat(${compareList.length}, 1fr)`}}>
                                                <div className="p-3 md:p-4 bg-slate-800/50"></div>
                                                {compareList.map(p => (
                                                    <div key={p.id} className="p-3 md:p-4 text-center border-l border-slate-800">
                                                        <button 
                                                            onClick={() => {
                                                                addToCart(p);
                                                                setShowComparison(false);
                                                            }}
                                                            disabled={p.stock === 0}
                                                            className="btn-primary px-4 py-2 rounded-lg text-xs md:text-sm disabled:opacity-50 disabled:cursor-not-allowed"
                                                        >
                                                            <i className="fas fa-cart-plus mr-1"></i> Add
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* CHAT WIDGET */}
                    <div className="chat-widget">
                        {showChat ? (
                            <div className="glass-panel flex h-[560px] w-[min(24rem,calc(100vw-1rem))] flex-col rounded-3xl shadow-2xl md:h-[600px] md:w-96">
                                <div className="p-6 border-b border-slate-700 flex justify-between items-center">
                                    <div>
                                        <h3 className="font-bold text-white">Chat Support</h3>
                                        <div className="flex items-center gap-2 text-xs text-slate-400">
                                            <div className="live-indicator"></div>
                                            Online Now
                                        </div>
                                    </div>
                                    <button onClick={() => setShowChat(false)} className="text-slate-400 hover:text-white">
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>

                                <div className="flex-1 p-6 overflow-y-auto scroller space-y-4">
                                    {chatMessages.map((m, i) => (
                                        <div key={i} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`max-w-[80%] p-3 rounded-2xl ${
                                                m.sender === 'user' 
                                                    ? 'bg-lime-500 text-black' 
                                                    : 'bg-slate-800 text-white'
                                            }`}>
                                                {m.text}
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <div className="p-4 border-t border-slate-700">
                                    <a
                                        href={STORE_WHATSAPP_LINK}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="secondary-button mb-3 inline-flex w-full items-center justify-center gap-2 rounded-xl px-4 py-3 text-sm font-semibold"
                                    >
                                        <i className="fab fa-whatsapp"></i>
                                        Continue on WhatsApp
                                    </a>
                                    <div className="flex gap-2">
                                        <input 
                                            value={chatInput}
                                            onChange={(e) => setChatInput(e.target.value)}
                                            onKeyDown={(e) => e.key === 'Enter' && handleChatSubmit()}
                                            placeholder="Type your message..."
                                            className="glass-input flex-1 px-4 py-3 rounded-xl"
                                        />
                                        <button 
                                            onClick={handleChatSubmit}
                                            className="btn-primary px-6 py-3 rounded-xl"
                                        >
                                            <i className="fas fa-paper-plane"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <button
                                onClick={() => setShowChat(true)}
                                className="chat-bubble w-16 h-16 rounded-full flex items-center justify-center text-black text-2xl shadow-2xl"
                                aria-label="Open chat support"
                            >
                                <i className="fas fa-comments"></i>
                            </button>
                        )}
                    </div>

                    {/* AERO DIGITAL SOLUTIONS FOOTER */}
                    <footer className="mt-16 pb-8">
                        <div className="container mx-auto px-4 sm:px-6">
                            <div className="glass-card rounded-2xl p-4 sm:p-6 border border-slate-700/50">
                                <div className="flex flex-col md:flex-row items-center justify-center gap-4 text-center">
                                    <div className="flex items-center gap-3 sm:gap-4">
                                        <img 
                                            src={AERO_LOGO_URL} 
                                            alt="Aero Digital Solutions" 
                                            className="h-10 w-10 sm:h-12 sm:w-12 object-contain"
                                        />
                                        <div className="text-left">
                                            <div className="text-[10px] sm:text-xs text-slate-500 uppercase tracking-wider font-bold">Payment Integration by</div>
                                            <div className="text-sm sm:text-base font-bold text-white">Aero Digital Solutions</div>
                                        </div>
                                    </div>
                                    <div className="hidden md:block w-px h-8 bg-slate-700"></div>
                                    <div className="text-xs text-slate-400">
                                        <i className="fas fa-shield-alt text-lime-400 mr-2"></i>
                                        Secure payment processing powered by DPO PayGate
                                    </div>
                                </div>
                            </div>
                        </div>
                    </footer>
                    </div>
                </div>
            );
        }

        // Render App immediately
        try {
            console.log('Starting app...');
            const rootElement = document.getElementById('root');
            if (!rootElement) {
                console.error('Root element not found!');
            } else {
                const root = ReactDOM.createRoot(rootElement);
                root.render(<App />);
                console.log('App rendered successfully');
            }
        } catch (error) {
            console.error('Failed to render app:', error);
            setTimeout(() => {
                document.body.innerHTML = `
                    <div style="display: flex; align-items: center; justify-content: center; height: 100vh; background: #020617; color: white; font-family: sans-serif; flex-direction: column; padding: 20px;">
                        <div style="font-size: 24px; margin-bottom: 16px; color: #ef4444;">⚠️ Error Loading</div>
                        <div style="color: #94a3b8; font-size: 14px; max-width: 600px; text-align: center; margin-bottom: 20px;">
                            ${error.message || 'Unknown error'}<br><br>
                            Check browser console (F12) for details.
                        </div>
                        <button onclick="location.reload()" style="background: #84cc16; color: black; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">
                            Reload Page
                        </button>
                    </div>
                `;
            }, 100);
        }
    </script>
</body>
</html>
