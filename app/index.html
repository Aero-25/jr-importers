    <link rel="canonical" href="https://jr-importers.pages.dev/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:type" content="website" />

    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Opens the TLS connection to Supabase while the bundle is still parsing. -->
    <link rel="preconnect" href="https://snkvszndxwpozrefnpnv.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://snkvszndxwpozrefnpnv.supabase.co" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "JR Importers",
        "description": "Imported consumer electronics retailer in Namibia.",
        "url": "https://jr-importers.pages.dev/",
        "image": "https://jr-importers.pages.dev/icon.svg",
        "priceRange": "N$$",
        "currenciesAccepted": "NAD",
        "paymentAccepted": "Cash, Card, EFT, Layby",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Windhoek",
          "addressCountry": "NA"
        },
        "areaServed": { "@type": "Country", "name": "Namibia" }
      }
    </script>

    <!-- Legacy runtime config. Kept so a deploy can retarget Supabase without a rebuild. -->
    <script src="/config.js"></script>
