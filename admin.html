<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="JR Importers admin dashboard for retail operations, online orders, reporting, and stock control.">

    <meta name="robots" content="noindex,nofollow">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap');
        
        :root {
            --bg-dark: #0f1419;
            --bg-panel: #1a1f2e;
            --bg-input: #0a0e17;
            --border: #2d3748;
            --accent: #10b981;
            --accent-hover: #059669;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
        }

        * { 
            font-family: 'Inter', sans-serif; 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-primary); 
            overflow: hidden;
        }
        
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .glass-panel { 
            background: var(--bg-panel); 
            border: 1px solid var(--border); 
            box-shadow: 0 4px 24px rgba(0,0,0,0.4); 
        }
        
        .glass-input { 
            background: var(--bg-input); 
            border: 1px solid var(--border); 
            color: white; 
            transition: all 0.2s; 
        }
        
        .glass-input:focus { 
            outline: none; 
            border-color: var(--accent); 
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1); 
        }
        
        .nav-group { margin-bottom: 4px; }
        
        .nav-group-header {
            padding: 8px 16px;
            font-size: 11px;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.1em;
            transition: all 0.15s;
            user-select: none;
        }
        
        .nav-group-header:hover {
            background: rgba(255,255,255,0.05);
            color: var(--text-primary);
        }
        
        .nav-group-header i.fa-chevron-down {
            transition: transform 0.2s;
            font-size: 10px;
        }
        
        .nav-group-header.open i.fa-chevron-down {
            transform: rotate(180deg);
        }
        
        .nav-group-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        
        .nav-group-content.open {
            max-height: 600px;
        }
        
        .nav-item {
            padding: 8px 16px 8px 32px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 10px;
            user-select: none;
        }
        
        .nav-item:hover {
            background: rgba(16, 185, 129, 0.1);
            color: var(--text-primary);
            border-left-color: var(--accent);
        }
        
        .nav-item.active {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent);
            border-left-color: var(--accent);
            font-weight: 600;
        }
        
        .nav-item i { width: 16px; text-align: center; }
        
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }
        
        .btn-primary {
            background: var(--accent);
            color: white;
        }
        
        .btn-primary:hover { 
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary { background: #374151; color: white; }
        .btn-secondary:hover { background: #4b5563; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .badge-success { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .badge-warning { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .badge-danger { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .badge-info { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
        .badge-gray { background: rgba(156, 163, 175, 0.2); color: #9ca3af; }
        .badge-orange { background: rgba(249, 115, 22, 0.2); color: #f97316; }
        .badge-purple { background: rgba(168, 85, 247, 0.2); color: #a855f7; }
        
        .data-table { 
            width: 100%; 
            font-size: 13px;
            border-collapse: separate;
            border-spacing: 0;
        }
        
        .data-table thead {
            background: rgba(255,255,255,0.03);
            text-transform: uppercase;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }
        
        .data-table th, .data-table td { padding: 12px 16px; text-align: left; }
        
        .data-table tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }
        
        .data-table tbody tr:hover { background: rgba(16, 185, 129, 0.05); }
        
        .pos-product-search { font-size: 16px; padding: 14px 20px; }
        
        .pos-cart-item {
            padding: 12px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all 0.15s;
        }
        
        .pos-cart-item:hover {
            background: rgba(255,255,255,0.04);
            border-color: var(--accent);
        }
        
        .pos-total-display {
            font-size: 48px;
            font-weight: 900;
            color: var(--accent);
            text-align: right;
        }
        
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.2s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            animation: slideIn 0.3s;
        }
        
        @keyframes slideIn {
            from { transform: translateX(400px); }
            to { transform: translateX(0); }
        }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: rgba(16, 185, 129, 0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(16, 185, 129, 0.5); }
        
        .stat-card {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, var(--bg-panel) 100%);
            border-left: 4px solid var(--accent);
            transition: all 0.2s;
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.2);
        }
        
        .quick-action-card {
            cursor: pointer;
            transition: all 0.2s;
            background: var(--bg-panel);
            border: 1px solid var(--border);
        }
        
        .quick-action-card:hover {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .admin-topbar {
            background:
                radial-gradient(circle at top left, rgba(16, 185, 129, 0.12), transparent 34%),
                rgba(26, 31, 46, 0.96);
            backdrop-filter: blur(18px);
        }

        .command-button {
            min-width: 260px;
            justify-content: space-between;
            background: rgba(10, 14, 23, 0.82);
            border: 1px solid rgba(148, 163, 184, 0.18);
            color: var(--text-secondary);
        }

        .command-palette {
            width: min(720px, calc(100vw - 32px));
            background: #111827;
            border: 1px solid rgba(16, 185, 129, 0.25);
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.58);
        }

        .command-row {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            color: var(--text-primary);
            transition: all 0.15s;
        }

        .command-row:hover {
            background: rgba(16, 185, 129, 0.12);
        }

        .ops-alert {
            border: 1px solid rgba(148, 163, 184, 0.14);
            background: rgba(15, 23, 42, 0.72);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
        }

        .ops-alert.warning { border-color: rgba(245, 158, 11, 0.26); }
        .ops-alert.danger { border-color: rgba(239, 68, 68, 0.28); }
        .ops-alert.info { border-color: rgba(59, 130, 246, 0.24); }

        .sidebar-backdrop {
            display: none;
        }
        
        .fade-in { animation: fadeIn 0.3s; }
        
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        input[type="number"] { -moz-appearance: textfield; }
        
        .till-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(16, 185, 129, 0.2);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
        }
        
        .till-status.closed {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        .form-group { margin-bottom: 16px; }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
        }

        textarea.form-input {
            min-height: 100px;
            resize: vertical;
        }

        select.form-input { cursor: pointer; }
        
        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        
        /* MOBILE OPTIMIZATION */
        @media (max-width: 768px) {
            body {
                overflow: auto;
            }

            .sidebar { 
                width: 100%; 
                max-width: 280px;
                position: fixed;
                left: -280px;
                top: 0;
                height: 100vh;
                z-index: 1000;
                transition: left 0.3s ease;
            }
            
            .sidebar.mobile-open {
                left: 0;
            }

            .sidebar-backdrop {
                display: block;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.58);
                z-index: 900;
            }

            .command-button {
                min-width: 0;
                width: 44px;
                justify-content: center;
            }

            .command-button span,
            .command-button kbd {
                display: none;
            }
            
            .main-content { 
                margin-left: 0; 
                width: 100%;
                padding: 12px;
            }
            
            .data-table {
                font-size: 12px;
            }
            
            .data-table th,
            .data-table td {
                padding: 8px 4px;
            }
            
            .glass-panel {
                padding: 12px;
            }
            
            .btn {
                padding: 8px 12px;
                font-size: 13px;
            }
            
            /* Hide less important columns on mobile */
            .data-table td:nth-child(n+5),
            .data-table th:nth-child(n+5) {
                display: none;
            }
            
            /* Stack stats cards vertically */
            .grid {
                grid-template-columns: 1fr !important;
            }
        }
        
        @media (max-width: 480px) {
            .data-table {
                font-size: 11px;
            }
            
            .data-table th,
            .data-table td {
                padding: 6px 2px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // ===== CONFIGURATION =====
        const SUPABASE_URL = window.JR_CONFIG?.SUPABASE_URL;
        const SUPABASE_KEY = window.JR_CONFIG?.SUPABASE_ANON_KEY;
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const DEBUG = Boolean(window.JR_DEBUG_MODE);
        const AUTO_WHATSAPP_WORKER_URL = window.JR_CONFIG?.WHATSAPP_WORKER_URL || window.JR_WHATSAPP_WORKER_URL || '';
        const LOGO_URL = window.JR_CONFIG?.LOGO_URL || '/icon.svg';
        const STORE_WHATSAPP_NUMBER = '26481562920';
        const hasConfiguredWorkerUrl = (url) => typeof url === 'string' && url.trim().length > 0;
        const debugLog = (...args) => {
            if (DEBUG) {
                window.console.log(...args);
            }
        };

        // ===== UTILITY FUNCTIONS =====
        const formatCurrency = (amount) => `N$ ${parseFloat(amount).toLocaleString('en-NA', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        const formatDate = (date) => new Date(date).toLocaleDateString('en-NA');
        const formatDateTime = (date) => new Date(date).toLocaleString('en-NA');
        
        // Status badge color helper
        const getStatusBadgeClass = (status) => {
            const statusColors = {
                'Pending': 'badge-warning',      // Yellow
                'Paid': 'badge-success',         // Green
                'Processing': 'badge-info',      // Blue
                'Shipped': 'badge-purple',       // Purple
                'Delivered': 'badge-purple',     // Purple
                'Cancelled': 'badge-danger',     // Red
                'Pickup': 'badge-orange'         // Orange
            };
            return statusColors[status] || 'badge-gray';
        };

        // ===== TOAST COMPONENT =====
        function Toast({ message, type, onClose }) {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, []);

            const colors = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                warning: 'bg-yellow-500',
                info: 'bg-blue-500'
            };

            return (
                <div className={`toast ${colors[type]} text-white px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3 min-w-[320px]`}>
                    <i className={`fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'} text-xl`}></i>
                    <span className="flex-1 font-semibold">{message}</span>
                    <button onClick={onClose} className="hover:opacity-70">
                        <i className="fas fa-times"></i>
                    </button>
                </div>
            );
        }

        // ===== MODAL COMPONENT =====
        function Modal({ isOpen, onClose, title, children, size = 'md' }) {
            if (!isOpen) return null;

            const sizes = {
                sm: 'max-w-md',
                md: 'max-w-2xl',
                lg: 'max-w-4xl',
                xl: 'max-w-6xl',
                full: 'max-w-7xl'
            };

            return (
                <div className="modal-backdrop" onClick={onClose}>
                    <div 
                        className={`glass-panel rounded-2xl p-6 ${sizes[size]} w-full mx-4 max-h-[90vh] overflow-y-auto`}
                        onClick={(e) => e.stopPropagation()}
                    >
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-bold">{title}</h2>
                            <button 
                                onClick={onClose} 
                                className="w-10 h-10 rounded-lg bg-red-500/20 hover:bg-red-500 flex items-center justify-center transition"
                            >
                                <i className="fas fa-times text-red-400 hover:text-white"></i>
                            </button>
                        </div>
                        {children}
                    </div>
                </div>
            );
        }

        // ===== MAIN APP =====
        function RetailManager() {
            // Supabase Authentication State
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [isAuthChecking, setIsAuthChecking] = useState(true);
            const [adminUser, setAdminUser] = useState(null);
            const [loginEmail, setLoginEmail] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [loginError, setLoginError] = useState('');
            
            // State Management
            const [view, setView] = useState('dashboard');
            const [mobileSidebarOpen, setMobileSidebarOpen] = useState(false);
            const [commandPaletteOpen, setCommandPaletteOpen] = useState(false);
            const [commandSearch, setCommandSearch] = useState('');
            const [openGroups, setOpenGroups] = useState(['sales', 'inventory', 'purchasing']);
            const [notifications, setNotifications] = useState([]);
            const [modal, setModal] = useState(null);
            const [orderFilter, setOrderFilter] = useState('all'); // all, pending, paid, processing, shipped, delivered, pickup
            const [orderSearch, setOrderSearch] = useState('');
            const [modalData, setModalData] = useState({});
            const [loading, setLoading] = useState(true);
            const [dataLoaded, setDataLoaded] = useState(false);
            
            // Till Management
            const [tillOpen, setTillOpen] = useState(false);
            const [tillFloat, setTillFloat] = useState(0);
            const [currentShift, setCurrentShift] = useState(null);
            
            // POS State
            const [cart, setCart] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCustomer, setSelectedCustomer] = useState(null);
            const searchInputRef = useRef(null);
            
            // Split Payment States
            const [showSplitPayment, setShowSplitPayment] = useState(false);
            const [cashAmount, setCashAmount] = useState(0);
            const [cardAmount, setCardAmount] = useState(0);
            const [bankTransferAmount, setBankTransferAmount] = useState(0);
            
            // Color/IMEI Selection States
            const [productToAdd, setProductToAdd] = useState(null);
            const [availableColors, setAvailableColors] = useState([]);
            const [availableImeis, setAvailableImeis] = useState([]);
            const [selectedColor, setSelectedColor] = useState('');
            const [selectedImei, setSelectedImei] = useState('');
            const [showColorImeiSelector, setShowColorImeiSelector] = useState(false);
            
            // Filter States
            const [productFilter, setProductFilter] = useState('');
            const [categoryFilter, setCategoryFilter] = useState('');
            const [customerFilter, setCustomerFilter] = useState('');
            const [supplierFilter, setSupplierFilter] = useState('');
            const [dateFilter, setDateFilter] = useState({ from: '', to: '' });
            const [onlineCustomerSearch, setOnlineCustomerSearch] = useState('');
            const [expenseSearch, setExpenseSearch] = useState('');
            const [userSearch, setUserSearch] = useState('');
            const [settingSearch, setSettingSearch] = useState('');
            
            // Modal Form States (moved to component level to avoid hooks in conditionals)
            const [invoiceItems, setInvoiceItems] = useState([]);
            const [invoiceCustomerId, setInvoiceCustomerId] = useState('');
            const [invoiceDueDate, setInvoiceDueDate] = useState('');
            const [poItems, setPoItems] = useState([]);
            const [poSupplierId, setPoSupplierId] = useState('');
            const [poNotes, setPoNotes] = useState('');
            const [grvItems, setGrvItems] = useState([]);
            const [grvSupplierId, setGrvSupplierId] = useState('');
            const [grvSupplierInvoiceNo, setGrvSupplierInvoiceNo] = useState('');
            const [grvInvoiceDate, setGrvInvoiceDate] = useState('');
            const [grvPoNumber, setGrvPoNumber] = useState('');
            const [grvNotes, setGrvNotes] = useState('');
            const [tillDenominations, setTillDenominations] = useState({});
            
            // Reset modal form state when modal changes
            useEffect(() => {
                if (modal === 'invoice-form') {
                    setInvoiceItems([]);
                    setInvoiceCustomerId('');
                    setInvoiceDueDate(new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0]);
                } else if (modal === 'po-form') {
                    setPoItems([]);
                    setPoSupplierId('');
                    setPoNotes('');
                } else if (modal === 'grv-form') {
                    setGrvItems([]);
                    setGrvSupplierId('');
                    setGrvSupplierInvoiceNo('');
                    setGrvNotes('');
                }
            }, [modal]);
            
            // Data
            const [data, setData] = useState({
                products: [],
                orders: [],
                customers: [],
                suppliers: [],
                purchase_orders: [],
                stock_takes: [],
                grvs: [],
                expenses: [],
                users: [],
                quotes: [],
                invoices: [],
                laybys: [],
                stock_movements: [],
                debtors: [],
                till_shifts: [],
                settings: [],
                hero_images: [],
                product_imeis: [],
                service_charges: [],
                coupons: []
            });

            // Load Data on Mount - Check Supabase Auth
            useEffect(() => {
                const checkAuth = async () => {
                    try {
                        // Check if there's an existing session
                        const { data: { session } } = await db.auth.getSession();
                        
                        if (session) {

            const loadAllData = async () => {

                        try {
                            let q = db.from(table).select(query);
                            if (orderBy) q = q.order(orderBy.column, { ascending: orderBy.asc !== false });
                            const { data, error } = await q;
                            if (error && error.code === 'PGRST116') return []; // Table doesn't exist
                            return data || [];
                        } catch (e) {
                            console.warn(`Table ${table} not available:`, e.message);
                            return [];
                        }

                        safeFetch('orders', 'id, customer_name, customer_email, customer_phone, delivery_address, delivery_method, total_amount, status, payment_method, payment_reference, items, created_at, updated_at, courier_company, waybill_number, date_dispatched, picked_up_at, paid_at, reservation_expires_at, stock_reserved, stock_returned, user_id, customer_city, customer_region, coupon_code, coupon_discount, dpo_trans_ref', { column: 'created_at', asc: false }),

            const addToCart = async (product) => {
                if (product.stock <= 0) {
                    showNotification('Product out of stock!', 'error');
                    return;
                }

                // Check if product has IMEI tracking
                const { data: imeis, error: imeiError } = await db.from('product_imeis')
                    .select('*')
                    .eq('product_id', product.id)
                    .eq('status', 'available');
                
                if (imeiError) {
                    console.error('Error fetching IMEIs:', imeiError);
                }
                
                // If product has IMEI tracking, show selector
                if (imeis && imeis.length > 0) {
                    // Get available colors
                    const colors = [...new Set(imeis.map(i => i.color).filter(Boolean))];
                    
                    setProductToAdd(product);
                    setAvailableImeis(imeis);
                    setAvailableColors(colors.length > 0 ? colors : ['Default']);
                    setSelectedColor(colors.length > 0 ? colors[0] : 'Default');
                    setSelectedImei('');
                    setShowColorImeiSelector(true);
                    return;
                }
                
                // No IMEI tracking - add directly (legacy flow)
                const existingItem = cart.find(item => item.id === product.id && !item.imei);
                
                if (existingItem) {
                    if (existingItem.qty >= product.stock) {
                        showNotification('Not enough stock available!', 'warning');
                        return;
                    }
                    setCart(cart.map(item =>
                        item.id === product.id && !item.imei
                            ? { ...item, qty: item.qty + 1 }
                            : item
                    ));
                } else {
                    setCart([...cart, { ...product, qty: 1 }]);
                }
                
                showNotification(`Added ${product.name} to cart`, 'success');
                setSearchTerm('');
            };

                    showNotification('Please select an IMEI/Serial number', 'error');
                    return;
                }
                
                // Get the selected IMEI object
                const imeiObj = availableImeis.find(i => i.id === parseInt(selectedImei));
                
                // Check if this IMEI already in cart
                const existingItem = cart.find(item => item.imei_id === imeiObj?.id);
                if (existingItem) {
                    showNotification('This unit is already in cart!', 'warning');
                    return;
                }
                
                // Add to cart with IMEI tracking
                setCart([...cart, { 
                    ...productToAdd, 
                    qty: 1, // Always 1 for IMEI-tracked items
                    color: selectedColor,
                    imei: imeiObj?.imei,
                    imei_id: imeiObj?.id,
                    imei_tracked: true
                }]);
                
                showNotification(`Added ${productToAdd.name} (${selectedColor}) to cart`, 'success');

                    return;

                if (newQty <= 0) {
                    setCart(cart.filter(item => item.id !== productId));

            const cartTotal = useMemo(() => {
                const subtotal = cart.reduce((sum, item) => {
                    const price = item.customPrice !== undefined ? item.customPrice : item.price;
                    return sum + (price * item.qty);
                }, 0);
                const vat = subtotal * 0.15;
                return { subtotal, vat, total: subtotal + vat };
            }, [cart]);

            const completeSale = async (paymentMethod, splitPayments = null) => {
                if (cart.length === 0) {

                try {
                    // Determine payment details

                    let finalPaymentMethod = paymentMethod;
                    
                    if (splitPayments) {
                        // Split payment
                        finalPaymentMethod = 'Split Payment';
                        paymentDetails = `Cash: ${formatCurrency(splitPayments.cash || 0)}, Card: ${formatCurrency(splitPayments.card || 0)}, Bank Transfer: ${formatCurrency(splitPayments.bankTransfer || 0)}`;
                    }

                    // Create order
                    const { data: order, error } = await db.from('orders').insert({
                        customer_name: selectedCustomer?.name || 'Walk-in Customer',
                        customer_email: selectedCustomer?.email || 'walk-in@jrimporters.com',
                        customer_phone: selectedCustomer?.phone || 'N/A',
                        delivery_method: 'Pickup',
                        delivery_address: selectedCustomer?.address || 'In-Store Pickup',
                        user_id: selectedCustomer?.id,
                        items: cart.map(item => {
                            const actualPrice = item.customPrice !== undefined ? item.customPrice : item.price;
                            const itemData = {
                                id: item.id,
                                name: item.name,
                                qty: item.qty,
                                price: actualPrice,
                                original_price: item.price,
                                price_adjusted: item.customPrice !== undefined && item.customPrice !== item.price,
                                subtotal: item.qty * actualPrice
                            };
                            
                            // Add IMEI tracking info if available
                            if (item.imei_tracked) {
                                itemData.imei = item.imei;
                                itemData.imei_id = item.imei_id;
                                itemData.color = item.color;
                            }
                            
                            return itemData;
                        }),
                        total_amount: cartTotal.total,
                        payment_method: finalPaymentMethod,
                        payment_reference: paymentDetails,
                        status: 'Paid',
                        created_at: new Date().toISOString()
                    }).select().single();

                    if (error) throw error;

                    // Update stock for each item - FETCH CURRENT STOCK FIRST
                    for (const item of cart) {
                        if (item.imei_tracked && item.imei_id) {
                            // IMEI-tracked item - mark specific unit as sold
                            await db.from('product_imeis')
                                .update({ 
                                    status: 'sold',
                                    sold_order_id: order.id,
                                    sold_at: new Date().toISOString()
                                })
                                .eq('id', item.imei_id);
                            
                            // Still decrement product stock
                            const { data: currentProduct } = await db.from('products')
                                .select('stock')
                                .eq('id', item.id)
                                .single();
                            
                            const currentStock = currentProduct?.stock || 0;
                            const newStock = currentStock - 1; // Always -1 for IMEI items
                            
                            await db.from('products')
                                .update({ stock: newStock })
                                .eq('id', item.id);
                            
                            // Record stock movement with IMEI
                            await db.from('stock_movements').insert({
                                product_id: item.id,
                                product_name: item.name,
                                movement_type: 'Sale',
                                quantity: -1,
                                reference_type: 'Order',
                                reference_id: order.id,
                                user_name: adminUser?.email || 'Admin',
                                notes: `IMEI: ${item.imei}, Color: ${item.color}`,
                                created_at: new Date().toISOString()
                            });
                        } else {
                            // Regular item without IMEI tracking
                            const { data: currentProduct } = await db.from('products')
                                .select('stock')
                                .eq('id', item.id)
                                .single();
                            
                            const currentStock = currentProduct?.stock || 0;
                            const newStock = currentStock - item.qty;
                            
                            await db.from('products')
                                .update({ stock: newStock })
                                .eq('id', item.id);
                                
                            await db.from('stock_movements').insert({
                                product_id: item.id,
                                product_name: item.name,
                                movement_type: 'Sale',
                                quantity: -item.qty,
                                reference_type: 'Order',
                                reference_id: order.id,
                                user_name: adminUser?.email || 'Admin',
                                created_at: new Date().toISOString()
                            });
                        }
                    }

                    printReceipt(order);

                    setSelectedCustomer(null);
                    setShowSplitPayment(false);

                    setCardAmount(0);
                    setBankTransferAmount(0);

                );
                
                const cashSales = todayOrders.filter(o => o.payment_method === 'Cash')

                // Save till shift to database

            const cancelOrder = async (id) => {
                if (!confirm('CANCEL order? Stock will be restored.')) return;
                try {
                    debugLog('Attempting to cancel order:', id);
                    
                    // Get order details first to restore stock
                    const { data: order, error: fetchError } = await db
                        .from('orders')
                        .select('items, status')
                        .eq('id', id)
                        .single();
                    
                    if (fetchError) {
                        console.error('Fetch error:', fetchError);
                        throw fetchError;
                    }
                    
                    if (!order) {
                        throw new Error('Order not found');
                    }
                    
                    // SAFEGUARD: Don't restore stock if already cancelled
                    if (order.status === 'Cancelled') {
                        showNotification('Order is already cancelled', 'info');
                        return;
                    }
                    
                    debugLog('Order found:', order);
                    
                    // Cancel the order FIRST
                    await db.from('orders').update({ status: 'Cancelled' }).eq('id', id).neq('status', 'Cancelled');
                    
                    // Restore stock for each item
                    if (order.items && order.items.length > 0) {
                        debugLog('Restoring stock for cancelled order...');
                        
                        for (const item of order.items) {
                            try {
                                const itemQty = parseInt(item.qty) || 1;
                                let hasImeis = false;
                                
                                // Check if this product uses IMEI system and restore IMEIs first
                                if (item.sku || item.color) {
                                    const color = item.color || (item.sku ? item.sku.split('-').slice(-2, -1)[0] : null);
                                    
                                    // Find and restore the IMEIs that were sold
                                    const { data: imeis } = await db
                                        .from('product_imeis')
                                        .select('*')
                                        .eq('product_id', item.id)
                                        .eq('status', 'sold')
                                        .eq('color', color)
                                        .limit(itemQty);
                                    
                                    if (imeis && imeis.length > 0) {
                                        hasImeis = true;
                                        // Restore status to available
                                        for (const imei of imeis) {
                                            await db
                                                .from('product_imeis')
                                                .update({ status: 'available' })
                                                .eq('id', imei.id);
                                            
                                            debugLog(`✅ Restored IMEI/Serial: ${imei.imei_serial} (${color})`);
                                        }
                                    }
                                }
                                
                                // ONLY restore product.stock if this product does NOT use IMEI system
                                if (!hasImeis) {
                                    const { data: product } = await db
                                        .from('products')
                                        .select('stock')
                                        .eq('id', item.id)
                                        .single();
                                    
                                    if (product) {
                                        const newStock = (product.stock || 0) + itemQty;
                                        
                                        await db
                                            .from('products')
                                            .update({ stock: newStock })
                                            .eq('id', item.id);
                                        
                                        debugLog(`✅ Restored stock for ${item.name}: ${product.stock} → ${newStock}`);
                                    }
                                }
                            } catch (itemError) {
                                console.error(`Error restoring stock for ${item.name}:`, itemError);
                            }
                        }
                    }
                    
                    showNotification('Order cancelled & stock restored', 'success');
                    loadAllData();
                } catch (e) {
                    console.error('Cancel error:', e);
                    showNotification('Error: ' + e.message, 'error');
                }
            };

                const reportData = filteredOrders.flatMap(order => 
                    (order.items || []).map(item => {
                        const product = data.products.find(p => p.id === item.id);
                        const costPrice = product?.cost_price || 0;
                        const sellPrice = item.price;
                        const totalCost = costPrice * item.qty;
                        const totalRevenue = sellPrice * item.qty;
                        const profit = totalRevenue - totalCost;
                        const margin = totalRevenue > 0 ? (profit / totalRevenue * 100) : 0;

                        return {
                            'Order #': order.id,
                            'Date': formatDate(order.created_at),
                            'Customer': order.customer_name,
                            'Product': item.name,
                            'Quantity': item.qty,

                            'Payment': order.payment_method

                    'Date': '',
                    'Customer': '',
                    'Product': 'TOTALS:',

                    return c.name?.toLowerCase().includes(search) ||

            const filteredOnlineCustomers = useMemo(() => {
                const search = onlineCustomerSearch.trim().toLowerCase();
                const grouped = new Map();

                onlineOrders.forEach((order) => {
                    const identity = (order.customer_email || order.customer_phone || `${order.customer_name}-${order.id}` || '').toLowerCase();
                    if (!identity) return;

                    const existing = grouped.get(identity) || {
                        id: identity,
                        customer_name: order.customer_name || 'Unknown customer',
                        customer_email: order.customer_email || '',
                        customer_phone: order.customer_phone || '',
                        orders: 0,
                        totalSpent: 0,
                        lastOrderAt: order.created_at,
                        latestOrder: order
                    };

                    existing.orders += 1;
                    existing.totalSpent += order.status === 'Paid' ? Number(order.total_amount || 0) : 0;

                    if (!existing.customer_email && order.customer_email) {
                        existing.customer_email = order.customer_email;
                    }
                    if (!existing.customer_phone && order.customer_phone) {
                        existing.customer_phone = order.customer_phone;
                    }
                    if (new Date(order.created_at) > new Date(existing.lastOrderAt || 0)) {
                        existing.lastOrderAt = order.created_at;
                        existing.latestOrder = order;
                        existing.customer_name = order.customer_name || existing.customer_name;
                    }

                    grouped.set(identity, existing);

                        return [customer.customer_name, customer.customer_email, customer.customer_phone]

                        expiringSoon: order.reservation_expires_at

                try {
                    if (navigator.clipboard?.writeText) {
                        await navigator.clipboard.writeText(text);
                    } else {
                        const helper = document.createElement('textarea');
                        helper.value = text;
                        helper.setAttribute('readonly', 'readonly');
                        helper.style.position = 'absolute';
                        helper.style.left = '-9999px';
                        document.body.appendChild(helper);
                        helper.select();
                        document.execCommand('copy');
                        document.body.removeChild(helper);
                    }

                    showNotification(successMessage, 'success');
                } catch (error) {
                    console.error('Clipboard error:', error);
                    showNotification('Unable to copy to clipboard', 'error');
                }
            };

                    `Hello ${order.customer_name || 'there'},`,
                    '',
                    `This is JR Importers following up on your pending order #${order.id}.`,
                    `Total due: ${formatCurrency(order.total_amount || 0)}`,
                    `Payment method: ${order.payment_method || 'Pending payment'}`,
                    '',
                    'Reply if you need help completing payment or arranging collection/delivery.'
                ].join('\n');

                await copyToClipboard(reminderMessage, 'Recovery message copied');

                const whatsappNumber = normaliseWhatsappNumber(order.customer_phone);
                if (whatsappNumber) {
                    window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(reminderMessage)}`, '_blank', 'noopener,noreferrer');
                    return;
                }

                if (order.customer_email) {
                    const subject = encodeURIComponent(`JR Importers order #${order.id} follow-up`);
                    const body = encodeURIComponent(reminderMessage);
                    window.location.href = `mailto:${order.customer_email}?subject=${subject}&body=${body}`;
                    return;
                }

                showNotification('No phone or email found for this customer. Message copied instead.', 'warning');
            };

                        const { error } = await db.from('expenses').update(payload).eq('id', modalData.editId);

                                                                const generateBarcode = () => {
                                                                    // Start with country code (620 = Namibia-like placeholder)
                                                                    const prefix = '620';
                                                                    // Generate random 9 digits for manufacturer + product
                                                                    const randomDigits = Math.floor(Math.random() * 1000000000).toString().padStart(9, '0');
                                                                    const baseCode = prefix + randomDigits;
                                                                    
                                                                    // Calculate EAN-13 check digit
                                                                    let sum = 0;
                                                                    for (let i = 0; i < 12; i++) {
                                                                        const digit = parseInt(baseCode[i]);
                                                                        sum += (i % 2 === 0) ? digit : digit * 3;
                                                                    }
                                                                    const checkDigit = (10 - (sum % 10)) % 10;
                                                                    
                                                                    return baseCode + checkDigit;
                                                                };
                                                                
                                                                // Check if barcode exists and regenerate if needed
                                                                let barcode;
                                                                let isUnique = false;
                                                                let attempts = 0;
                                                                
                                                                while (!isUnique && attempts < 10) {
                                                                    barcode = generateBarcode();

                                                                        .select('id')

                                                                        isUnique = true;
                                                                    }
                                                                    attempts++;
                                                                }

                                            return;
                                        }
                                        
                                        try {
                                            const couponData = {
                                                code: modalData.code.toUpperCase(),
                                                discount_type: modalData.discount_type || 'percentage',
                                                discount_value: parseFloat(modalData.discount_value),
                                                min_purchase: parseFloat(modalData.min_purchase) || 0,
                                                max_uses: modalData.max_uses ? parseInt(modalData.max_uses) : null,
                                                valid_from: modalData.valid_from || new Date().toISOString(),
                                                valid_until: modalData.valid_until || null,
                                                active: modalData.active !== false,
                                                notes: modalData.notes || null,
                                                created_by: adminUser?.email || 'Admin'
                                            };
                                            
                                            if (modalData.id) {
                                                delete couponData.created_by;
                                                await db.from('coupons').update(couponData).eq('id', modalData.id);
                                                showNotification('Coupon updated successfully', 'success');
                                            } else {
                                                await db.from('coupons').insert(couponData);
                                                showNotification('Coupon created successfully', 'success');
                                            }
                                            
                                            setModal(null);
                                            loadAllData();
                                        } catch (err) {
                                            console.error('Coupon save error:', err);
                                            showNotification('Error: ' + err.message, 'error');
                                        }
                                    }} className="btn btn-primary flex-1">
                                        <i className="fas fa-save mr-2"></i>
                                        {modalData.id ? 'Update' : 'Create'} Coupon
                                    </button>
                                </div>
                            </div>
                        </Modal>
                    )}
                </div>
            );
        }

        // RENDER APP
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RetailManager />);
    </script>
</body>
</html>
