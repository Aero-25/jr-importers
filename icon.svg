<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="jrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101a2e" />
      <stop offset="55%" stop-color="#0a1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="jrAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#65a30d" />
      <stop offset="45%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <radialGradient id="jrGlow" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="rgba(132,204,22,0.30)" />
      <stop offset="100%" stop-color="rgba(132,204,22,0)" />
    </radialGradient>
    <filter id="jrSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <!-- Badge -->
  <rect width="512" height="512" rx="124" fill="url(#jrBg)" />
  <rect width="512" height="512" rx="124" fill="url(#jrGlow)" />
  <rect x="30" y="30" width="452" height="452" rx="100" fill="none"
        stroke="rgba(132,204,22,0.28)" stroke-width="3" />

  <!-- Orbit ring (import / global trade motif) -->
  <ellipse cx="256" cy="256" rx="176" ry="92" fill="none"
           stroke="rgba(148,163,184,0.18)" stroke-width="6"
           transform="rotate(-28 256 256)" />
  <circle cx="408" cy="178" r="13" fill="url(#jrAccent)" />
  <circle cx="408" cy="178" r="22" fill="url(#jrAccent)" opacity="0.35" filter="url(#jrSoft)" />

  <!-- JR monogram -->
  <text x="256" y="312" text-anchor="middle" font-size="208"
        font-family="'Space Grotesk','Segoe UI',Arial,sans-serif"
        font-weight="700" letter-spacing="-6" fill="url(#jrAccent)">JR</text>

  <!-- Spark accent (electronics) -->
  <path d="M250 360 l22 0 -14 30 30 0 -44 60 12 -42 -22 0 z"
        fill="#bef264" opacity="0.92" />
</svg>
