name: Build Admin APK

# Builds the JR Importers Admin Android app (Capacitor) in the cloud and publishes
# the APK as a downloadable artifact + a GitHub Release. No local Android toolchain needed.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'src/admin/**'
      - 'src/lib/**'
      - 'src/ui/**'
      - 'config.js'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # The APK carries the built console rather than loading the live site, so
      # the web build has to happen before Capacitor copies anything.
      - name: Build the console
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Bundle admin web app
        working-directory: mobile
        run: node copy-web.js

      - name: Add Android platform
        working-directory: mobile
        run: npx cap add android

      - name: Add camera permission to AndroidManifest
        working-directory: mobile
        run: |
          node -e "const fs=require('fs');const p='android/app/src/main/AndroidManifest.xml';let x=fs.readFileSync(p,'utf8');if(!x.includes('android.permission.CAMERA')){x=x.replace('<application','    <uses-permission android:name=\"android.permission.CAMERA\" />\n    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />\n\n    <application');fs.writeFileSync(p,x);console.log('camera permission added');}else{console.log('camera permission already present');}"

      - name: Generate icons & splash
        working-directory: mobile
        run: npx capacitor-assets generate --android || echo "asset generation skipped"

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk out/JR-Importers-Admin.apk

      # The repo is private, so the GitHub release below is unreachable from a
      # staff phone — its download URL answers 404 to anyone not signed in.
      # The copy staff actually install lives in the public `apk` bucket on
      # Supabase Storage; the console's download buttons point there.
      - name: Publish APK to Supabase Storage
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SERVICE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY secret is not set — the download in the console will serve a stale APK"
            exit 1
          fi
          SUPABASE_URL=$(grep -oP "SUPABASE_URL: '\K[^']+" config.js)
          curl --fail -sS -X POST \
            "$SUPABASE_URL/storage/v1/object/apk/JR-Importers-Admin.apk" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary @out/JR-Importers-Admin.apk
          echo "published: $SUPABASE_URL/storage/v1/object/public/apk/JR-Importers-Admin.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JR-Importers-Admin-APK
          path: out/JR-Importers-Admin.apk
          if-no-files-found: error

      - name: Publish to Release (android-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: JR Importers POS — latest APK
          body: |
            Latest JR Importers POS / Admin Android build.
            Download `JR-Importers-Admin.apk`, enable "Install unknown apps", and install.

            - Ships its own copy of the admin console — the console only, no storefront.
            - Camera barcode scanning enabled (grant the camera permission on first scan).
            - Sign in with your staff account.
          files: out/JR-Importers-Admin.apk
          make_latest: true
